<!--
  sidebar.html
  ------------
  Sidebar component for EKIP Dashboard. Contains Logo, Navigation and Collapse control.
-->
<aside class="sidebar-wrapper" id="sidebar" aria-label="Sidebar Navigation">
  <!-- Brand logo & header -->
  <div class="sidebar-header d-flex align-items-center justify-content-between">
    <a href="/" class="sidebar-brand d-flex align-items-center gap-2 text-decoration-none">
      <div class="brand-icon" aria-hidden="true">
        <i class="bi bi-cpu-fill"></i>
      </div>
      <span class="brand-name-text fw-bold text-white">EKIP Suite</span>
    </a>
    <button type="button" class="btn-close-sidebar-mobile d-md-none" id="btnSidebarCloseMobile" aria-label="Close sidebar">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Main navigation menu -->
  <nav class="sidebar-nav flex-grow-1 d-flex flex-column py-3">
    {% include "partials/navigation.html" %}
  </nav>

  <!-- Sidebar Footer / Version Info -->
  <div class="sidebar-footer px-3 py-2 text-center border-top border-secondary-subtle">
    <small class="text-muted xsmall-text text-truncate d-block" style="font-size: 0.7rem; opacity: 0.6;">EKIP Suite v2</small>
  </div>

  <!-- Sidebar collapse button for desktop -->
  <div class="sidebar-collapse-toggle-wrapper d-none d-md-flex">
    <button type="button" class="btn-sidebar-collapse" id="btnSidebarCollapse" aria-label="Collapse sidebar">
      <i class="bi bi-chevron-left" id="collapseIcon"></i>
    </button>
  </div>
</aside>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
