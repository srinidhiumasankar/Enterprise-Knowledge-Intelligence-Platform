<!DOCTYPE html>
<!--
  base.html
  ---------
  Master layout template for the Enterprise Knowledge Intelligence Platform.
  All pages extend this template via Jinja2 block inheritance.

  Blocks exposed to child templates:
    block title          — <title> tag content
    block extra_head     — additional <head> elements (styles, meta)
    block content        — main page body
    block extra_scripts  — page-specific scripts loaded before </body>
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Enterprise Knowledge Intelligence Platform — AI-powered document intelligence using Retrieval-Augmented Generation (RAG), built with FastAPI and Python."
    />

    <!-- Page title — child templates override this block -->
    <title>{% block title %}Enterprise Knowledge Intelligence Platform{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom application styles -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />

    {% block extra_head %}{% endblock %}
  </head>

  <body>

    <!-- ================================================================
         Navbar
         Sticky top navigation with brand logo and phase badge.
    ================================================================ -->
    <nav class="navbar navbar-expand-lg ekip-navbar" id="mainNav" aria-label="Main navigation">
      <div class="container">

        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="/" id="navBrand">
          <span class="brand-icon" aria-hidden="true">
            <i class="bi bi-cpu-fill"></i>
          </span>
          <span class="brand-name">Enterprise Knowledge Intelligence Platform</span>
        </a>

        <!-- Mobile toggle -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav links -->
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto align-items-center gap-2">
            <li class="nav-item">
              <a class="nav-link active" href="/" id="navHome">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/docs" id="navDocs" target="_blank" rel="noopener">
                API Docs
              </a>
            </li>
            <li class="nav-item">
              <span class="nav-badge" id="navPhaseBadge">Phase 2</span>
            </li>
          </ul>
        </div>

      </div>
    </nav>

    <!-- ================================================================
         Main content area — child templates inject here
    ================================================================ -->
    <main id="mainContent">
      {% block content %}{% endblock %}
    </main>

    <!-- ================================================================
         Footer
    ================================================================ -->
    <footer class="ekip-footer" id="mainFooter">
      <div class="container">
        <div class="footer-inner">
          <p class="footer-brand-line">
            <span class="footer-brand">EKIP</span>
            &mdash; Enterprise Knowledge Intelligence Platform
          </p>
          <p class="footer-tech-line">
            Built using
            <span class="footer-tech-pill">
              <i class="bi bi-lightning-fill"></i> FastAPI
            </span>
            <span class="footer-tech-pill">
              <i class="bi bi-bootstrap-fill"></i> Bootstrap
            </span>
            <span class="footer-tech-pill">
              <i class="bi bi-filetype-py"></i> Python
            </span>
          </p>
        </div>
      </div>
    </footer>

    <!-- Bootstrap 5 JS bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmzq7i5fWMChS2B4IlHfg9M38pQ0"
      crossorigin="anonymous"
    ></script>

    <!-- Custom application scripts -->
    <script src="{{ url_for('static', path='js/app.js') }}"></script>

    {% block extra_scripts %}{% endblock %}
  </body>
</html>
